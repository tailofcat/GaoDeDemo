<!-- 输入坐标定位组件 -->
<div class="input-section">
  <h4>输入坐标定位</h4>
  <div class="input-group">
    <label>经度:</label>
    <input type="number" id="input-lng" step="0.000001" placeholder="116.397428">
  </div>
  <div class="input-group">
    <label>纬度:</label>
    <input type="number" id="input-lat" step="0.000001" placeholder="39.90923">
  </div>
  <button class="btn btn-confirm" id="goto-btn" style="width: 100%;">定位</button>
</div>
