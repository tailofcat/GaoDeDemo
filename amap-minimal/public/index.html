<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width" />
  <title>AmapPicker 演示</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }
    .demo-container {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .demo-title {
      text-align: center;
      font-size: 20px;
      color: #333;
      margin-bottom: 20px;
    }
    .demo-events {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-top: 20px;
    }
    .demo-events h3 {
      margin: 0 0 10px;
      font-size: 14px;
      color: #333;
    }
    .demo-log {
      max-height: 200px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      color: #666;
      background: #f9f9f9;
      padding: 10px;
      border-radius: 4px;
    }
    .demo-log div {
      padding: 2px 0;
      border-bottom: 1px solid #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="demo-title">AmapPicker 地图选点组件演示</div>

    <!-- 组件挂载点 -->
    <div id="amap-picker-mount"></div>

    <!-- 事件日志 -->
    <div class="demo-events">
      <h3>事件日志</h3>
      <div class="demo-log" id="event-log"></div>
    </div>
  </div>

  <script src="/src/amap-picker.js"></script>
  <script>
    // 初始化 AmapPicker
    var picker = new AmapPicker({
      container: '#amap-picker-mount',
      apiKey: '3a8f7c80daf5e3f05cd014c06de9eaab',
      securityHost: 'http://localhost:3001/_AMapService',
      defaultCenter: [113.337680, 23.141447],
      defaultZoom: 18,
      placeholder: {
        lng: '113.337680',
        lat: '23.141447'
      }
    });

    // 事件日志
    var logEl = document.getElementById('event-log');

    function addLog(eventName, data) {
      var div = document.createElement('div');
      div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + eventName + ': ' + JSON.stringify(data);
      logEl.insertBefore(div, logEl.firstChild);
    }

    picker.on('select', function (data) {
      addLog('select', data);
    });

    picker.on('confirm', function (data) {
      addLog('confirm', data);
    });

    picker.on('open', function () {
      addLog('open', {});
    });

    picker.on('close', function () {
      addLog('close', {});
    });

    picker.on('historyChange', function (data) {
      addLog('historyChange', data.length + ' records');
    });

    picker.on('error', function (err) {
      addLog('error', err.message);
    });
  </script>
</body>
</html>
