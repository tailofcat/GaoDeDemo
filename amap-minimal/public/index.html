<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width" />
  <title>AMap V2 Demo</title>
  <style>
    html, body, #container {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #info-panel {
      position: fixed;
      top: 10px;
      left: 10px;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 100;
      min-width: 200px;
    }
    #info-panel h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
    }
    #info-panel p {
      margin: 5px 0;
      font-size: 14px;
    }
    #info-panel button {
      margin-top: 10px;
      padding: 8px 16px;
      background: #1677ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #info-panel button:hover {
      background: #4096ff;
    }
    #input-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e8e8e8;
    }
    #input-section h4 {
      margin: 0 0 10px 0;
      font-size: 14px;
    }
    #input-section .input-group {
      margin-bottom: 8px;
    }
    #input-section label {
      display: inline-block;
      width: 45px;
      font-size: 13px;
    }
    #input-section input {
      width: 120px;
      padding: 5px 8px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 13px;
    }
    #input-section input:focus {
      outline: none;
      border-color: #1677ff;
    }
    #goto-btn {
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="info-panel">
    <h3>地图选点</h3>
    <p><strong>经度:</strong> <span id="lng">-</span></p>
    <p><strong>纬度:</strong> <span id="lat">-</span></p>
    <button id="clear-btn">清除标记</button>
    <div id="input-section">
      <h4>输入坐标定位</h4>
      <div class="input-group">
        <label>经度:</label>
        <input type="number" id="input-lng" step="0.000001" placeholder="116.397428">
      </div>
      <div class="input-group">
        <label>纬度:</label>
        <input type="number" id="input-lat" step="0.000001" placeholder="39.90923">
      </div>
      <button id="goto-btn">定位</button>
    </div>
  </div>
  <script type="text/javascript">
    window._AMapSecurityConfig = {
      serviceHost: '/_AMapService'
    };
  </script>
  <script type="text/javascript" src="/amap/api/maps?v=2.0"></script>
  <script type="text/javascript">
    var map = new AMap.Map('container', {
      viewMode: '2D',
      zoom: 11,
      center: [116.397428, 39.90923]
    });

    var marker = null;
    var infoWindow = null;

    AMap.plugin(['AMap.ToolBar', 'AMap.Scale', 'AMap.HawkEye', 'AMap.MapType', 'AMap.Geolocation', 'AMap.InfoWindow'], function() {
      map.addControl(new AMap.Scale());
      map.addControl(new AMap.ToolBar());
      map.addControl(new AMap.MapType());
      map.addControl(new AMap.HawkEye({ isOpen: true }));
      
      // 添加定位控件
      var geolocation = new AMap.Geolocation({
        enableHighAccuracy: true,
        timeout: 10000,
        zoomToAccuracy: true,
        buttonPosition: 'RB'
      });
      map.addControl(geolocation);

      // 创建信息窗口
      infoWindow = new AMap.InfoWindow({
        offset: new AMap.Pixel(0, -30)
      });

      // 绑定地图点击事件
      map.on('click', function(e) {
        var lng = e.lnglat.getLng();
        var lat = e.lnglat.getLat();
        
        // 更新面板显示
        document.getElementById('lng').textContent = lng.toFixed(6);
        document.getElementById('lat').textContent = lat.toFixed(6);
        
        // 移除旧标记
        if (marker) {
          map.remove(marker);
        }
        
        // 添加新标记
        marker = new AMap.Marker({
          position: e.lnglat,
          title: '选点位置'
        });
        map.add(marker);
        
        // 显示信息窗口
        infoWindow.setContent('<div style="padding: 10px;"><p><strong>经度:</strong> ' + lng.toFixed(6) + '</p><p><strong>纬度:</strong> ' + lat.toFixed(6) + '</p></div>');
        infoWindow.open(map, e.lnglat);
      });
    });

    // 清除标记按钮
    document.getElementById('clear-btn').addEventListener('click', function() {
      if (marker) {
        map.remove(marker);
        marker = null;
      }
      if (infoWindow) {
        infoWindow.close();
      }
      document.getElementById('lng').textContent = '-';
      document.getElementById('lat').textContent = '-';
    });

    // 定位按钮
    document.getElementById('goto-btn').addEventListener('click', function() {
      var lng = parseFloat(document.getElementById('input-lng').value);
      var lat = parseFloat(document.getElementById('input-lat').value);

      if (isNaN(lng) || isNaN(lat)) {
        alert('请输入有效的经纬度坐标');
        return;
      }

      // 验证经纬度范围
      if (lng < -180 || lng > 180 || lat < -90 || lat > 90) {
        alert('经度范围：-180 到 180，纬度范围：-90 到 90');
        return;
      }

      console.log('[' + new Date().toISOString() + '] 点击定位按钮');

      // 定义定位函数
      function performLocate(count) {
        console.log('[' + new Date().toISOString() + '] 触发第 ' + count + ' 次定位');
        
        var position = new AMap.LngLat(lng, lat);

        // 更新面板显示
        document.getElementById('lng').textContent = lng.toFixed(6);
        document.getElementById('lat').textContent = lat.toFixed(6);

        // 移除旧标记
        if (marker) {
          map.remove(marker);
        }

        // 添加新标记
        marker = new AMap.Marker({
          position: position,
          title: '输入位置'
        });
        map.add(marker);

        // 地图中心移到该位置
        map.setCenter(position);
        map.setZoom(17);

        // 显示信息窗口
        infoWindow.setContent('<div style="padding: 10px;"><p><strong>经度:</strong> ' + lng.toFixed(6) + '</p><p><strong>纬度:</strong> ' + lat.toFixed(6) + '</p></div>');
        infoWindow.open(map, position);
      }

      // 立即执行第一次
      performLocate(1);

      // 间隔1秒执行第2、3次
      setTimeout(function() { performLocate(2); }, 1000);
      setTimeout(function() { performLocate(3); }, 2000);
    });

    // 支持回车键触发定位
    document.getElementById('input-lng').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('goto-btn').click();
      }
    });
    document.getElementById('input-lat').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('goto-btn').click();
      }
    });
  </script>
</body>
</html>
