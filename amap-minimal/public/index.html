<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width" />
  <title>AMap V2 Demo</title>
  <style>
    html, body, #container {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #panel {
      position: fixed;
      top: 20px;
      left: 20px;
      background-color: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      z-index: 100;
      width: 300px;
    }
    #search-input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    #search-button {
      width: 100%;
      padding: 10px;
      background-color: #1677ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #search-button:hover {
      background-color: #4096ff;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="panel">
    <h3 style="margin-top: 0;">地点搜索</h3>
    <input type="text" id="search-input" placeholder="输入地点名称（如：天安门）">
    <button id="search-button">搜索</button>
  </div>
  <script type="text/javascript">
    window._AMapSecurityConfig = {
      serviceHost: '/_AMapService'
    };
  </script>
  <script type="text/javascript" src="/amap/api/maps?v=2.0"></script>
  <script type="text/javascript">
    var map = new AMap.Map('container', {
      viewMode: '2D',
      zoom: 11,
      center: [116.397428, 39.90923]
    });

    // 添加地图控件
    map.addControl(new AMap.Scale());
    map.addControl(new AMap.ToolBar());
    map.addControl(new AMap.ControlBar());
    map.addControl(new AMap.MapType());
    map.addControl(new AMap.Geolocation());

    var placeSearch;
    // 加载搜索插件
    AMap.plugin('AMap.PlaceSearch', function() {
      placeSearch = new AMap.PlaceSearch({
        pageSize: 10,
        pageIndex: 1,
        extensions: 'base'
      });
    });

    // 搜索功能
    document.getElementById('search-button').addEventListener('click', function() {
      var keyword = document.getElementById('search-input').value;
      if (!keyword) {
        alert('请输入搜索关键词');
        return;
      }
      if (placeSearch) {
        placeSearch.search(keyword, function(status, result) {
          if (status === 'complete' && result.info === 'OK') {
            var pois = result.poiList.pois;
            if (pois.length > 0) {
              var firstPoi = pois[0];
              map.setZoomAndCenter(15, firstPoi.location);
              // 添加标记
              var marker = new AMap.Marker({
                position: firstPoi.location,
                title: firstPoi.name
              });
              map.clearMap();
              map.add(marker);
              // 信息窗体
              var infoWindow = new AMap.InfoWindow({
                content: '<h3>' + firstPoi.name + '</h3><p>' + firstPoi.address + '</p>'
              });
              infoWindow.open(map, firstPoi.location);
            } else {
              alert('未找到相关地点');
            }
          } else {
            alert('搜索失败：' + result.info);
          }
        });
      } else {
        alert('搜索插件尚未加载完成');
      }
    });

    // 回车键搜索
    document.getElementById('search-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('search-button').click();
      }
    });
  </script>
</body>
</html>
